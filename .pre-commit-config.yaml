# Install with `uv run pre-commit install`; run everything with `uv run pre-commit run --all-files`.
# The local hooks need `pnpm install` first.
exclude: |
  (?x)^(
    tests/fixtures/.*|
    assets/logos/.*\.svg
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, css, html, json, markdown, yaml]
        exclude: ^(pnpm-lock\.yaml|uv\.lock)$
      - id: prettier-check
        name: prettier (check only)
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        types_or: [javascript, css, html, json, markdown, yaml]
        exclude: ^(pnpm-lock\.yaml|uv\.lock)$
        stages: [manual]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0
        language: system
        types: [javascript]
