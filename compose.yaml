services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CACHE_DB: /data/cache.sqlite3
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
