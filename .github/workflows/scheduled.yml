name: Weekly image scan

# Catches new vulnerabilities in the base image and dependencies between releases:
# scans the published :main image and a fresh rebuild of main with the newest base image.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-image-scan
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaagut/cve-viewer
  TRIVY_VERSION: "v0.76.2"

jobs:
  scan:
    name: Scan ${{ matrix.target }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the published image, also while the package is private
      security-events: write # upload Trivy results to code scanning
    strategy:
      fail-fast: false
      matrix:
        target: [published, rebuilt]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        if: matrix.target == 'published'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        if: matrix.target == 'published'
        run: |
          docker pull "${IMAGE}:main"
          docker tag "${IMAGE}:main" cve-desk:scan

      - name: Set up Docker Buildx
        if: matrix.target == 'rebuilt'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Rebuild image with the newest base image
        if: matrix.target == 'rebuilt'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: cve-desk:scan

      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: cve-desk:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.target }}

      - name: Fail on fixable critical or high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: cve-desk:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
