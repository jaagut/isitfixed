name: Publish image

# Pushes to main publish ghcr.io/jaagut/isitfixed:main and :sha-<short>.
# Release tags must be strict SemVer: vMAJOR.MINOR.PATCH publishes :MAJOR.MINOR.PATCH and :latest;
# vMAJOR.MINOR.PATCH-PRERELEASE (for example v1.2.0-rc.1) publishes only :1.2.0-rc.1. Other tags fail.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jaagut/isitfixed

jobs:
  validate:
    name: Validate ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.ref.outputs.stable }}
    steps:
      - name: Check tag format
        id: ref
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF}" = "refs/heads/main" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SemVer 2.0.0 core and pre-release (no build metadata, no leading zeros).
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if printf '%s' "${REF_NAME}" | grep -Eqx "v${num}\.${num}\.${num}"; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${REF_NAME}" | grep -Eqx "v${num}\.${num}\.${num}-${ident}(\.${ident})*"; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '${REF_NAME}' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE; nothing is published."
            exit 1
          fi

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # reusable CI reads workflow metadata when uploading Trivy results
      security-events: write # the reusable CI workflow uploads Trivy results

  publish:
    name: Build and push
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.validate.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=Is It Fixed
            org.opencontainers.image.description=Self-hostable CVE case workspace with a vendor-data cache
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
          annotations: |
            org.opencontainers.image.title=Is It Fixed
            org.opencontainers.image.description=Self-hostable CVE case workspace with a vendor-data cache
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
