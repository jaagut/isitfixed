name: PR screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.16.1"
  NODE_VERSION: "26"

jobs:
  screenshots:
    name: Mocked screenshot matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - name: Preserve screenshots (including fork PRs)
        uses: actions/upload-artifact@v4
        with:
          name: mocked-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Publish screenshot gallery comment
        # Forks still capture screenshots, but cannot publish with a read-only token.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const branch = `screenshots/pr-${number}`;
            const files = (await fs.readdir('screenshots')).filter(f => /^(desktop|mobile)-(light|dark)-(home|small|complex)\.png$/.test(f)).sort();
            if (files.length !== 12) throw new Error('Expected all 12 screenshots');
            const tree = [];
            for (const file of files) {
              const content = await fs.readFile(`screenshots/${file}`);
              const blob = await github.rest.git.createBlob({owner, repo, content: content.toString('base64'), encoding: 'base64'});
              tree.push({path: file, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const createdTree = await github.rest.git.createTree({owner, repo, tree});
            let previous;
            try { previous = (await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`})).data.object.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            const commit = await github.rest.git.createCommit({owner, repo, message: `Screenshots for PR #${number} at ${context.payload.pull_request.head.sha}`, tree: createdTree.data.sha, parents: previous ? [previous] : []});
            if (previous) await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha});
            else await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha});
            const marker = '<!-- mocked-screenshots -->';
            const body = [marker, `## Mocked UI screenshots`, `Commit: ${context.payload.pull_request.head.sha}`, 'Synthetic data; desktop/mobile × light/dark × home/simple case/complex case.', ...files.map(file => `<details><summary>${file.replace('.png', '')}</summary>\n\n[Open image](https://github.com/${owner}/${repo}/blob/${commit.data.sha}/${file})\n\n![${file}](https://github.com/${owner}/${repo}/blob/${commit.data.sha}/${file}?raw=true)\n\n</details>`)].join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});
