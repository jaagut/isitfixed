name: PR screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "12.16.1"
  NODE_VERSION: "26"

jobs:
  screenshots:
    name: Mocked screenshot matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - name: Preserve screenshots (including fork PRs)
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mocked-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Comment with screenshot artifact
        # Fork tokens cannot write PR comments; their artifact is on the run page.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const marker = '<!-- mocked-screenshots -->';
            const body = [marker, '## Mocked UI screenshots',
              `Commit: ${context.payload.pull_request.head.sha}`,
              '12 PNGs: desktop/mobile × light/dark × home/simple case/complex case.',
              `[Download screenshots](${process.env.ARTIFACT_URL}) (retained for 14 days; GitHub sign-in required).`,
            ].join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number});
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number: number, body});
