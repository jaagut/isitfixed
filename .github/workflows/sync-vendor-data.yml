name: Refresh static vendor evidence
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - vendor-data/watchlist.json
      - scripts/sync-feeds.mjs
      - src/feeds.js
      - src/data.js
permissions:
  contents: write
concurrency:
  group: vendor-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync official data
        id: sync
        continue-on-error: true
        run: node scripts/sync-feeds.mjs
      - name: Save successful updates even if another source failed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh static vendor evidence'
            git push
          fi
      - name: Report partial source failures
        if: steps.sync.outcome == 'failure'
        run: exit 1
