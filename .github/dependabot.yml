# Daily dependency updates. Every ecosystem waits two days after a release (cooldown), matching
# `exclude-newer` in pyproject.toml and `minimumReleaseAge` in pnpm-workspace.yaml.
# Minor and patch updates are grouped per ecosystem; major updates get their own pull requests.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm-lock.yaml is supported by the npm ecosystem
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      javascript-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
