[project]
name = "cve-desk"
version = "0.1.0"
description = "A compact CVE case workspace with a FastAPI vendor-data cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
# Only resolve releases that have been public for at least two days.
exclude-newer = "2 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["F", "E", "B", "W", "I", "N", "UP"]
ignore = ["E501"]
